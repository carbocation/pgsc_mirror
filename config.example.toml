# Public example configuration. Copy this file and set local deployment values.
genome_build = "GRCh38"

[upstream]
base_urls = [
  "https://ftp.ebi.ac.uk/pub/databases/spot/pgs",
  "http://ftp.ebi.ac.uk/pub/databases/spot/pgs",
]
score_list = "pgs_scores_list.txt"
metadata_csv = "metadata/pgs_all_metadata_scores.csv"

[identity]
# Operators should include a real contact address for responsible upstream use.
user_agent = "pgsc-mirror/0.1"
contact = "mirror-operator@example.org"

[transfer]
# Concurrent small checksum-sidecar requests.
concurrency = 4
# Scoring files are downloaded, verified, uploaded, and removed per worker.
# With these defaults, retained scoring partials are bounded to two files and
# each compressed file is capped at 10 GiB.
file_concurrency = 2
max_file_size = "10GiB"
request_timeout = "2m"
max_attempts = 5
initial_backoff = "1s"
max_backoff = "30s"
# The lease is renewed while a run is active. After a hard shutdown another
# operator can take over once this interval expires.
lease_duration = "15m"
# Development safeguard only. Zero means all sidecars. A nonzero limit is
# permitted for plan, but reconcile/update refuse to publish a partial release.
sidecar_limit = 0

[targets]
local = true
gcs = false

[local]
root = "./mirror"

[gcs]
bucket = ""
prefix = "pgsc-mirror"
billing_project = ""

[state]
# Defaults to <local.root>/.pgsc-mirror/state.db when omitted.
path = "./mirror/.pgsc-mirror/state.db"
# Defaults beside state.path. Holds resumable downloads and provider staging.
work_dir = "./mirror/.pgsc-mirror/work"
# An interrupted inventory can resume without refetching successful sidecars.
# Older checkpoints are discarded so periodic reconcile still detects revisions.
checkpoint_max_age = "24h"

[retention]
missing_grace = "720h" # 30 days
keep_releases = 10

[verify]
default_sample = 100
# Advisory only: scheduling remains external to the one-shot binary.
schedule = "weekly"
